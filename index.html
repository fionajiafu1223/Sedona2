<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>能量球释放示例</title>
<style>
  body {
    margin: 0;
    height: 100vh;
    background: #111;
    display: flex;
    justify-content: center;
    align-items: flex-end;
    overflow: hidden;
  }

  .body-outline {
    position: relative;
    width: 200px;
    height: 400px;
    border: 2px solid #fff;
    border-radius: 100px 100px 50px 50px;
    box-shadow: 0 0 20px rgba(255,255,255,0.2);
  }

  .energy-ball {
    position: absolute;
    width: 40px;
    height: 40px;
    border-radius: 50%;
    cursor: pointer;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    transition: top 1s, opacity 0.5s;
  }

  .red { background: red; }
  .green { background: green; }
  .blue { background: blue; }

  .buttons {
    display: none;
    position: absolute;
    top: -60px;
    left: 50%;
    transform: translateX(-50%);
    gap: 10px;
  }

  .buttons button {
    padding: 5px 10px;
    cursor: pointer;
  }
</style>
</head>
<body>
<div class="body-outline">
  <div class="energy-ball red" data-color="red"></div>
  <div class="energy-ball green" data-color="green"></div>
  <div class="energy-ball blue" data-color="blue"></div>
  <div class="buttons">
    <button id="allow">允许离开</button>
    <button id="cancel">取消</button>
  </div>
</div>

<script>
  const balls = document.querySelectorAll('.energy-ball');
  const buttons = document.querySelector('.buttons');
  let selectedBall = null;

  balls.forEach(ball => {
    ball.addEventListener('click', () => {
      selectedBall = ball;
      ball.style.top = '20%';
      buttons.style.display = 'flex';
    });
  });

  document.getElementById('allow').addEventListener('click', () => {
    if (selectedBall) {
      selectedBall.style.top = '0%';
      selectedBall.style.opacity = 0;
      buttons.style.display = 'none';
      setTimeout(() => {
        selectedBall.style.opacity = 1;
        selectedBall.style.top = '50%';
      }, 1000);
    }
  });

  document.getElementById('cancel').addEventListener('click', () => {
    if (selectedBall) {
      selectedBall.style.top = '50%';
      buttons.style.display = 'none';
    }
  });
</script>
</body>
</html>
